name: Validate Mod

on:
  push:
    branches: [main]
    paths: ["mod/**", "scripts/validate/**"]
  pull_request:
    paths: ["mod/**", "scripts/validate/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Run validation
        run: python scripts/validate/validate_mod.py
